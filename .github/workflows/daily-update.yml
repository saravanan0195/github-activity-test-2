name: Daily Progress Update

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update daily log
        run: |
          mkdir -p daily_logs
          DATE=$(date -u +"%Y-%m-%d")
          echo "# Daily Progress - $DATE" > "daily_logs/$DATE.md"
          echo "" >> "daily_logs/$DATE.md"
          echo "Daily development log updated." >> "daily_logs/$DATE.md"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_logs
          git commit -m "chore: update daily progress" || echo "No changes to commit"
          git push